<style>
/* Layout: phone-first single column; sticky check-in header, status-sorted customer cards, bottom sheets for actions */
:root{

  --today:#A84A06; --today-bg:#FCE8D6; --late:#B42318; --late-bg:#FBE3E0;
  --soon:#1C5A9E; --soon-bg:#DFEAF7; --ok:#2B7535; --ok-bg:#E0F0E2;
  --wa:#128C4A; --wa-wall:#E7EFEA; --wa-bubble:#D9FDD3; --wa-meta:#667781;
  --pdf-paper:#FFFFFF; --pdf-ink:#14232A; --pdf-muted:#5A6A70; --pdf-line:#D7E0E2; --pdf-accent:#0C6660; --pdf-soft:#EAF4F3;
  --f-display:"Figtree",system-ui,sans-serif;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#4DBDB2; --accent-ink:#06211F; --accent-soft:#163A37;
  --today:#F2A15A; --today-bg:#3A2411; --late:#F2887E; --late-bg:#3B1915;
  --soon:#8DB8EE; --soon-bg:#132A43; --ok:#82CC8C; --ok-bg:#15301A; --wa:#4CD486; --wa-wall:#0B141A; --wa-bubble:#005C4B; --wa-meta:#9FB3BB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1618; --surface:#152227; --sunk:#1B2B31; --ink:#E4EDEE; --muted:#93A6AB; --line:#283A40;
  --accent:#4DBDB2; --accent-ink:#06211F; --accent-soft:#163A37;
  --today:#F2A15A; --today-bg:#3A2411; --late:#F2887E; --late-bg:#3B1915;
  --soon:#8DB8EE; --soon-bg:#132A43; --ok:#82CC8C; --ok-bg:#15301A; --wa:#4CD486; --wa-wall:#0B141A; --wa-bubble:#005C4B; --wa-meta:#9FB3BB; color-scheme:dark}

.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.p-today{background:var(--today-bg);color:var(--today)}
.p-late{background:var(--late-bg);color:var(--late)}
.p-soon{background:var(--soon-bg);color:var(--soon)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-info{background:var(--sunk);color:var(--muted)}
.issues{grid-column:1/-1;margin:2px 0 0;padding:8px 10px;border-radius:8px;background:var(--late-bg);color:var(--late);font-size:13px;list-style:none;display:flex;flex-direction:column;gap:2px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.section-h h2{font-size:16px}
.section-h span{font-size:13px;color:var(--muted)}

.settings{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.field .lbl{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12.5px}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--bg);width:100%;min-width:0}
.field textarea{min-height:150px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:16px}

.backdrop{position:fixed;inset:0;background:rgba(6,18,20,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.x{border:0;background:var(--sunk);border-radius:50%;width:32px;height:32px;flex:none;font-size:18px;line-height:1}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}

.shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}

.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}

.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.progress{font-size:13px;color:var(--muted)}
footer.help{font-size:12.5px;color:var(--muted);text-align:center;padding-top:8px}

/* PDF pages (rendered off-screen, always on white paper) */
#pdfStage{position:absolute;left:-12000px;top:0;width:794px}
.pp{width:794px;height:1123px;background:var(--pdf-paper);color:var(--pdf-ink);font-family:var(--f-body);padding:46px 50px 40px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}

.pp .msgs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pp .shotbox{flex:1;min-height:0;border:1px solid var(--pdf-line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}

@media (max-width:520px){
  .counts{grid-template-columns:repeat(2,1fr)}

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const toUTC = iso => { const [y,m,d] = iso.split('-').map(Number); return Date.UTC(y,m-1,d); };
const fromUTC = t => { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const addDays = (iso,n) => fromUTC(toUTC(iso) + n*86400000);
const diffDays = (a,b) => Math.round((toUTC(a) - toUTC(b))/86400000); // a - b
const ymd = iso => iso.split('-').map(Number);
const daysInMonth = (y,m) => new Date(Date.UTC(y,m,0)).getUTCDate();
const validYMD = (y,m,d) => y>1900 && y<2200 && m>=1 && m<=12 && d>=1 && d<=daysInMonth(y,m);
const mkISO = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
function addMonthsAnchor(iso, k){ const [y,m,d] = ymd(iso); let mm = m-1+k; const yy = y + Math.floor(mm/12); mm = ((mm%12)+12)%12; return mkISO(yy, mm+1, Math.min(d, daysInMonth(yy, mm+1))); }
const fmt = iso => { if(!iso) return '—'; const [y,m,d] = ymd(iso); return `${d} ${MON[m-1]} ${y}`; };
const fmtDow = iso => { const [y,m,d] = ymd(iso); return `${DOW[new Date(Date.UTC(y,m-1,d)).getUTCDay()]}, ${d} ${MON[m-1]}`; };
const fmtShort = iso => { const [,m,d] = ymd(iso); return `${d} ${MON[m-1]}`; };
const fmtZH = iso => { const [y,m,d] = ymd(iso); return `${y}年${m}月${d}日`; };
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------- state ---------- */
const LS_KEY = 'premium-due-reminder.v1';
const OLD_TPL_EN = "Dear {name},\n\nThis is a friendly reminder that your insurance premium[[ for policy {policy}]][[ of {amount}]] is due on {due_date}.\n\nPlease make payment on or before the due date to keep your coverage active. If you have already paid, please ignore this message.\n\nThank you.\n{sender}[[\nAccount manager: {manager}]]";
const OLD_TPL_ZH = "{name} 您好，\n\n温馨提醒：您的保单[[ {policy} ]]保费[[（{amount}）]]将于 {due_date} 到期。\n\n请于到期日或之前完成缴费，以确保保障持续有效。如您已缴付，请忽略此信息。\n\n谢谢！\n{sender}[[\n客户经理：{manager}]]";
const TPL_EN = "Dear {name},\n\n🔔 *Premium Payment Reminder*\n\nThis is a friendly reminder that your insurance premium is due soon:\n[[\n📄 Policy no.: *{policy}*]][[\n💰 Amount: *{amount}*]]\n📅 Due date: *{due_date}*\n\nPlease make payment on or before the due date to keep your coverage active. If you have already paid, kindly ignore this message.\n\nThank you 🙏\n*{sender}*[[\nAccount manager: {manager}]]";
const TPL_ZH = "{name} 您好，\n\n🔔 *保费缴付提醒*\n\n温馨提醒，您的保费即将到期：\n[[\n📄 保单号：*{policy}*]][[\n💰 金额：*{amount}*]]\n📅 到期日：*{due_date}*\n\n请于到期日或之前完成缴费，以确保保障持续有效。如您已缴付，请忽略此信息。\n\n谢谢 🙏\n*{sender}*[[\n客户经理：{manager}]]";
const waHTML = t => esc(t).replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
const DEFAULT_SETTINGS = { sender:'Customer Service Team', cc:'', currency:'', dateOrder:'DMY', blankFreq:'monthly', lang:'both', tplEN:TPL_EN, tplZH:TPL_ZH };
let S = { customers:[], settings:{...DEFAULT_SETTINGS}, sent:{}, isSample:true };
let asOf = todayISO();
let tab = 'due';
let shots = {}; // id -> objectURL

function save(){
  try{
    const out = { settings:S.settings, sent:S.sent, isSample:S.isSample };
    if(!S.isSample) out.customers = S.customers;
    localStorage.setItem(LS_KEY, JSON.stringify(out));
  }catch(e){}
}
function load(){
  try{ const raw = localStorage.getItem(LS_KEY); if(!raw) return false;
    const o = JSON.parse(raw); S.settings = {...DEFAULT_SETTINGS, ...(o.settings||{})}; S.sent = o.sent||{};
    // upgrade untouched old default wording to the new WhatsApp-styled wording (custom wording is kept)
    if(S.settings.tplEN === OLD_TPL_EN) S.settings.tplEN = TPL_EN;
    if(S.settings.tplZH === OLD_TPL_ZH) S.settings.tplZH = TPL_ZH;

/* ---------- parsing ---------- */
function parseDate(v, order){
  if(v===null || v===undefined) return {blank:true};
  if(v instanceof Date && !isNaN(v)) return {iso: mkISO(v.getFullYear(), v.getMonth()+1, v.getDate())};
  if(typeof v === 'number'){
    if(v>10000 && v<100000){ const t = Date.UTC(1899,11,30) + Math.round(v)*86400000; return {iso: fromUTC(t)}; }
    return {error:true};
  }
  const s = String(v).trim();
  if(!s || s==='-' || /^n\/?a$/i.test(s)) return {blank:true};
  let m;
  if((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[T\s].*)?$/))){ const y=+m[1],mo=+m[2],d=+m[3]; return validYMD(y,mo,d)?{iso:mkISO(y,mo,d)}:{error:true}; }
  if((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})$/))){
    let a=+m[1], b=+m[2], y=+m[3]; if(m[3].length===2){ const cut=(new Date().getFullYear()%100)+10; y += y>cut?1900:2000; }
    const [d,mo] = order==='MDY' ? [b,a] : [a,b];
    return validYMD(y,mo,d)?{iso:mkISO(y,mo,d)}:{error:true};
  }
  if((m = s.match(/^(\d{1,2})(?:st|nd|rd|th)?[\s\-]+([A-Za-z]{3,})\.?[\s\-,]+(\d{4})$/))){ const mo=MONTHS.indexOf(m[2].slice(0,3).toLowerCase())+1; const d=+m[1],y=+m[3]; return mo&&validYMD(y,mo,d)?{iso:mkISO(y,mo,d)}:{error:true}; }
  if((m = s.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})$/))){ const mo=MONTHS.indexOf(m[1].slice(0,3).toLowerCase())+1; const d=+m[2],y=+m[3]; return mo&&validYMD(y,mo,d)?{iso:mkISO(y,mo,d)}:{error:true}; }
  if((m = s.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日?$/))){ const y=+m[1],mo=+m[2],d=+m[3]; return validYMD(y,mo,d)?{iso:mkISO(y,mo,d)}:{error:true}; }
  return {error:true};
}
const FREQ = { monthly:1, quarterly:3, 'half-yearly':6, yearly:12 };
const FREQ_LABEL = { monthly:'Monthly', quarterly:'Quarterly', 'half-yearly':'Half-yearly', yearly:'Yearly' };
function parseFreq(v){
  const s = String(v ?? '').trim().toLowerCase().replace(/[\s_]+/g,'');
  if(!s) return {blank:true};
  if(['m','monthly','month','1','月缴','每月'].includes(s)) return {f:'monthly'};
  if(['q','quarterly','quarter','3','季缴'].includes(s)) return {f:'quarterly'};
  if(['h','hy','half','halfyearly','half-yearly','semiannual','semi-annual','semiannually','6','半年缴'].includes(s)) return {f:'half-yearly'};
  if(['y','yearly','annual','annually','year','12','年缴'].includes(s)) return {f:'yearly'};
  return {error:true};
}
function normPhone(raw, cc){
  let s = String(raw ?? '').trim();
  if(!s || s==='-' ) return {issue:'No phone number'};
  const plus = s.startsWith('+');
  let d = s.replace(/\D/g,'');
  if(!d) return {issue:`Phone "${s}" has no digits`};
  if(plus){ /* already international */ }
  else if(d.startsWith('00')) d = d.slice(2);
  else if(d.startsWith('0')){
    if(!cc) return {issue:'Local phone number: choose your country code in Settings', local:true};
    d = cc + d.slice(1);
  }
  if(d.length<10 || d.length>15) return {issue:`Phone "${s}" looks too ${d.length<10?'short':'long'}${typeof raw==='number'&&d.length<10?' (Excel may have dropped the leading 0)':''}`};
  return {wa:d};
}
function money(raw){
  if(raw===null || raw===undefined || String(raw).trim()==='') return '';
  const s = String(raw).trim();
  const n = Number(s.replace(/,/g,''));
  if(!isNaN(n) && /^[\d,.\s]+$/.test(s)){ const v = n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return S.settings.currency ? `${S.settings.currency} ${v}` : v; }
  return s;
}

/* ---------- analysis ---------- */
function cycleFor(iso){
  const [y,m,d] = ymd(iso);
  let start;
  if(d>=25) start = mkISO(y,m,25);
  else if(d>=5) start = mkISO(y,m,5);
  else { const p = addMonthsAnchor(mkISO(y,m,1),-1); const [py,pm]=ymd(p); start = mkISO(py,pm,25); }
  const [sy,sm,sd] = ymd(start);
  const next = sd===5 ? mkISO(sy,sm,25) : (()=>{ const n=addMonthsAnchor(mkISO(sy,sm,1),1); const [ny,nm]=ymd(n); return mkISO(ny,nm,5); })();
  return { start, next, end: addDays(next,3), isCheckIn: iso===start };
}
function analyzeAll(){
  const cyc = cycleFor(asOf);
  const st = S.settings;
  const list = S.customers.map(c => {
    const a = { c, issues:[], notes:[], blocking:false };
    if(!String(c.name||'').trim()){ a.issues.push('Customer name is missing'); a.blocking = true; }
    const dp = parseDate(c.dueRaw, st.dateOrder);
    if(dp.blank){ a.issues.push('Premium due date is missing'); a.blocking = true; }
    else if(dp.error){ a.issues.push(`Due date "${c.dueRaw}" is not a real date`); a.blocking = true; }
    else a.due = dp.iso;
    const fp = parseFreq(c.freqRaw);
    if(fp.error){ a.issues.push(`Frequency "${c.freqRaw}" not recognised`); a.blocking = true; }
    else if(fp.blank){ a.freq = st.blankFreq==='monthly' ? 'monthly' : ''; a.freqAssumed = !!a.freq; }
    else a.freq = fp.f;
    const ph = normPhone(c.phoneRaw, st.cc);
    if(ph.issue){ a.issues.push(ph.issue); a.phoneLocal = !!ph.local; } else a.wa = ph.wa;
    const bp = parseDate(c.birthdayRaw, st.dateOrder);
    if(bp.iso) a.bday = bp.iso; else if(bp.error) a.notes.push(`Birthday "${c.birthdayRaw}" unreadable`);
    if(a.due){
      if(a.freq){ let k=0, d=a.due; while(d < cyc.start && k<600){ k += FREQ[a.freq]; d = addMonthsAnchor(a.due,k); } a.next = d; }
      else { a.next = a.due; if(a.due < cyc.start){ a.issues.push('Due date has passed and no payment frequency is set'); a.blocking = true; } }
    }
    if(a.next && !a.blocking){
      a.inCycle = a.next >= cyc.start && a.next <= cyc.end;
      a.remindOn = addDays(a.next,-3);
      const dd = diffDays(a.next, asOf);
      a.key = c.id + '|' + a.next;
      if(S.sent[a.key]) a.status = 'sent';
      else if(dd < 0) a.status = 'late';
      else if(dd <= 3) a.status = 'today';
      else a.status = 'soon';
      a.daysLeft = dd;
    }
    if(a.bday && a.next){ const [,bm,bd] = ymd(a.bday); const [cy] = ymd(cyc.start); for(const yy of [cy,cy+1]){ if(!validYMD(yy,bm,bd)) continue; const b=mkISO(yy,bm,bd); if(b>=cyc.start && b<=cyc.end){ a.bdayInCycle=b; break; } } }
    return a;
  });
  // duplicates
  const seen = {};
  list.forEach(a => { const c=a.c; const k = c.policy ? 'p:'+String(c.policy).trim().toLowerCase() : (a.wa ? 'w:'+a.wa+'|'+String(c.name).trim().toLowerCase() : null); if(!k) return; (seen[k] = seen[k]||[]).push(a); });
  Object.values(seen).forEach(g => { if(g.length>1) g.forEach(a => a.issues.push(`Possible duplicate (${g.length} rows share this ${g[0].c.policy?'policy number':'name and phone'})`)); });
  return { cyc, list };
}
const ORDER = { today:0, late:1, soon:2, sent:3 };
function statusPill(a){
  if(a.status==='today') return `<span class="pill p-today">${a.daysLeft===0?'Due today · remind now':'Remind today'}</span>`;
  if(a.status==='late') return `<span class="pill p-late">Past due ${-a.daysLeft}d</span>`;
  if(a.status==='soon') return `<span class="pill p-soon">Remind on ${fmtShort(a.remindOn)}</span>`;
  if(a.status==='sent') return `<span class="pill p-ok">Reminded ${fmtShort(S.sent[a.key])}</span>`;
  return '';
}
function statusText(a){
  if(a.status==='today') return 'Remind today';
  if(a.status==='late') return `Past due (${-a.daysLeft} day${a.daysLeft===-1?'':'s'})`;
  if(a.status==='soon') return `Remind on ${fmtShort(a.remindOn)}`;
  if(a.status==='sent') return `Reminded ${fmtShort(S.sent[a.key])}`;
  return '';
}

function fill(tpl, v){
  const missing = [];
  let out = tpl.replace(/\[\[([\s\S]*?)\]\]/g, (m, inner) => { const keys=[...inner.matchAll(/\{(\w+)\}/g)].map(x=>x[1]); return keys.every(k => v[k]) ? inner : ''; });
  out = out.replace(/\{(\w+)\}/g, (m,k) => { if(v[k]) return v[k]; if(!(k in v)) return m; missing.push(k); return `[${k} missing]`; });
  return { text: out, missing };
}
function buildMsg(a, lang){

const FIELDS = [
  ['dueRaw','Premium due date',['premiumduedate','duedate','nextduedate','premiumdue','paymentduedate','due','nextdue','duedt','到期日','缴费日期']],
  ['birthdayRaw','Birthday',['birthday','dob','dateofbirth','birthdate','bday','生日','出生日期']],
  ['phoneRaw','Phone',['phone','mobile','phoneno','phonenumber','mobileno','mobilenumber','contact','contactno','contactnumber','hp','hpno','handphone','whatsapp','tel','telephone','电话','手机']],
  ['email','Email',['email','emailaddress','mail','电邮','邮箱']],
  ['manager','Account manager',['accountmanager','manager','agent','agentname','servicingagent','advisor','adviser','relationshipmanager','rm','am','客户经理']],
  ['policy','Policy no.',['policyno','policy','policynumber','policynum','contractno','certificateno','保单号']],
  ['amountRaw','Premium amount',['premiumamount','premium','amount','premiumrm','modalpremium','保费']],
  ['freqRaw','Frequency',['frequency','paymentfrequency','paymentmode','premiummode','mode','缴费方式']],
  ['company','Company',['company','companyname','employer','organisation','organization','business','公司']],
  ['name','Customer name',['customername','name','clientname','fullname','customer','client','policyholder','insuredname','客户姓名','姓名']],
];
const INCLUDES = { dueRaw:['due'], birthdayRaw:['birth','dob'], phoneRaw:['phone','mobile','whatsapp','contact'], email:['email'], manager:['manager','agent'], policy:['policy'], amountRaw:['premium','amount'], freqRaw:['frequency','mode'], company:['company'], name:['name'] };
function mapHeaders(headers){
  const norm = h => String(h||'').toLowerCase().replace(/[^a-z0-9一-鿿]/g,'');
  const map = {}, used = new Set();
  FIELDS.forEach(([key,,alts]) => { headers.forEach((h,i) => { if(map[key]===undefined && !used.has(i) && alts.includes(norm(h))){ map[key]=i; used.add(i); } }); });
  FIELDS.forEach(([key]) => { if(map[key]!==undefined) return; headers.forEach((h,i) => { if(map[key]===undefined && !used.has(i) && INCLUDES[key].some(w => norm(h).includes(w))){ map[key]=i; used.add(i); } }); });
  return map;
}
function rowsToCustomers(aoa){
  // find header row: first row in first 10 with >=2 recognised headers
  let hi = 0, best = -1, bestMap = {};
  for(let i=0;i<Math.min(10,aoa.length);i++){ const m = mapHeaders(aoa[i]||[]); const n = Object.keys(m).length; if(n>best){ best=n; hi=i; bestMap=m; } }
  const headers = aoa[hi] || [];
  const customers = [];
  for(let r=hi+1;r<aoa.length;r++){
    const row = aoa[r] || [];
    if(row.every(v => v===null || v===undefined || String(v).trim()==='')) continue;
    const c = { id: uid() };
    FIELDS.forEach(([key]) => { const i = bestMap[key]; let v = i===undefined ? '' : row[i]; if(v===undefined || v===null) v=''; c[key] = (typeof v==='string') ? v.trim() : v; });
    customers.push(c);
  }
  return { headers, map: bestMap, customers, headerRow: hi+1 };
}
async function readFile(file){
  const name = file.name.toLowerCase();
  if(/\.(pdf|png|jpe?g|heic|webp)$/.test(name)) return { error:"This is a PDF or picture. The app doesn't read customer details from images, so it can't misread a phone number or date. Open the list in Excel (or copy it into the blank template) and import the .xlsx or .csv." };
  if(!window.XLSX) return { error:'The spreadsheet reader did not load. Check your internet connection and reload the page.' };
  const buf = await file.arrayBuffer();
  return importBuffer(buf, file.name);
}
function importBuffer(buf, filename){
  try{
    // raw:true keeps CSV text exactly as typed (no leading-zero loss, no US-style date guessing)
    const wb = XLSX.read(buf, { type:'array', cellDates:false, raw:/\.csv$/i.test(filename) });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
    const res = rowsToCustomers(aoa);
    res.filename = filename; res.sheet = wb.SheetNames[0];
    return res;
  }catch(e){ return { error:`Couldn't read "${filename}". Save it as .xlsx or .csv and try again.` }; }
}

let dlP = null;
function downloads(){ if(!dlP) dlP = (window.claude && typeof window.claude.use==='function') ? window.claude.use('downloads').catch(()=>null) : Promise.resolve(null); return dlP; }
async function offerFile(filename, blob){
  const dl = await downloads();
  if(dl){
    try{ await dl.save({ filename, data: blob }); toast(`Saved ${filename}`); }
    catch(e){ toast(e && e.code==='declined' ? 'Download cancelled' : `Couldn't save the file here (${e && e.code || 'error'}).`); }
    return;
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 30000);
  toast(`Downloaded ${filename}`);
}
function pdfSummaryPages(due, cyc){
  const per = 15, pages = [];
  for(let i=0;i<Math.max(due.length,1);i+=per){

    pages.push(`<div class="pp"><div class="ph"><div><div class="tag">Premium due list</div><h1>Due ${fmtShort(cyc.start)} – ${fmt(cyc.end)}</h1><div class="sub">Check-in ${fmt(cyc.start)} · next check-in ${fmt(cyc.next)} · as of ${fmt(asOf)}</div></div><div class="sub" style="text-align:right">${due.length} customer${due.length===1?'':'s'}<br>Prepared by ${esc(S.settings.sender)}</div></div>
      <table><thead><tr><th>#</th><th>Customer</th><th>Policy</th><th>Premium</th><th>Due date</th><th>Remind</th><th>WhatsApp</th><th>Acc. manager</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="pf"><span>Premium Due Reminder · rule: remind 3 days before due date</span><span>__PAGE__</span></div></div>`);
  }
  return pages;
}
function pdfCustomerPage(a){
  const c = a.c, en = buildMsg(a,'en'), zh = buildMsg(a,'zh');
  const kv = (k,v) => `<div><span>${k}</span>${esc(v||'—')}</div>`;
  return `<div class="pp"><div class="ph"><div><div class="tag">Premium reminder</div><h1>${esc(c.name)}</h1><div class="sub">${esc(c.company||'')}</div></div><div style="text-align:right"><div class="sub">Due date</div><div style="font-family:var(--f-display);font-size:22px;font-weight:800">${fmt(a.next)}</div><div class="sub st">${esc(statusText(a))}</div></div></div>

    <div class="msgs"><div><div class="mlabel">Message · English</div><div class="mbox">${waHTML(en.text)}</div></div><div><div class="mlabel">信息 · 中文</div><div class="mbox zh">${waHTML(zh.text)}</div></div></div>

    <div class="pf"><span>Prepared by ${esc(S.settings.sender)} · generated ${fmt(todayISO())}</span><span>__PAGE__</span></div></div>`;

async function renderPages(htmls, onStep){
  const stage = $('#pdfStage'); const out = [];
  try{ await document.fonts.ready; }catch(e){}
  for(let i=0;i<htmls.length;i++){
    stage.innerHTML = htmls[i].replace('__PAGE__', `Page ${i+1} of ${htmls.length}`);
    const el = stage.firstElementChild;
    await Promise.all([...el.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    const canvas = await html2canvas(el, { scale:2, backgroundColor:'#FFFFFF', useCORS:true, logging:false, windowWidth:1000 });
    out.push(canvas); onStep && onStep(i+1, htmls.length);
  }
  stage.innerHTML = '';
  return out;
}
let busy = false;
async function makePdf(){
  if(busy) return; if(!window.html2canvas || !window.jspdf){ toast('The PDF tools did not load. Check your connection and reload.'); return; }
  busy = true;
  const { cyc, list } = A;
  const due = list.filter(a => a.inCycle).sort((x,y) => x.next.localeCompare(y.next) || String(x.c.name).localeCompare(String(y.c.name)));
  const prog = $('#progress'); prog.hidden = false;
  try{
    const pages = [...pdfSummaryPages(due, cyc), ...due.map(pdfCustomerPage)];
    const canvases = await renderPages(pages, (i,n) => { prog.textContent = `Building PDF… page ${i} of ${n}`; });
    const doc = new window.jspdf.jsPDF({ unit:'mm', format:'a4', compress:true });
    canvases.forEach((cv,i) => { if(i) doc.addPage(); doc.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,297); });
    const blob = doc.output('blob');
    window.__lastPdf = blob;
    prog.textContent = `PDF ready: ${pages.length} pages.`;
    await offerFile(`Premium-due-${cyc.start}.pdf`, blob);
  }catch(e){ prog.textContent = 'Something went wrong building the PDF. Try again.'; console.error(e); }
  busy = false;
}
async function makePng(id){
  const a = findA(id); if(!a || busy) return; busy = true;
  try{ const [cv] = await renderPages([pdfCustomerPage(a)]); const blob = await new Promise(r => cv.toBlob(r,'image/png')); await offerFile(`Reminder-${String(a.c.name).replace(/[^\w一-鿿]+/g,'-')}-${a.next}.png`, blob); }
  catch(e){ toast('Could not create the image.'); }
  busy = false;
}

/* ---------- toast ---------- */
let tt;
function toast(msg){ let t = $('.toast'); if(!t){ t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent = msg; t.hidden=false; clearTimeout(tt); tt = setTimeout(()=>{ t.hidden=true; }, 3200); }

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-tab]'); if(!t) return;
  if(t.dataset.tab){ tab = t.dataset.tab; render(); return; }
  const act = t.dataset.act, id = t.dataset.id;
  if(act==='close'){ closeSheet(); return; }
  if(act==='import'){ openImport(); return; }
  if(act==='pdf'){ makePdf(); return; }
  if(act==='png'){ makePng(id); return; }
  if(act==='send'){ openSend(id); return; }
  if(act==='edit'){ openEdit(id); return; }
  if(act==='lang'){ sendLang = t.dataset.lang; openSend(id); return; }
  if(act==='waOpened'){ if(!t.getAttribute('href')){ e.preventDefault(); return; } const m = $('#markStep'); if(m) m.hidden = false; return; }
  if(act==='copyMsg'){ const ta = $('#msgText'); try{ await navigator.clipboard.writeText(ta.value); toast('Message copied'); }catch(err){ ta.focus(); ta.select(); toast('Selected. Press copy on your keyboard.'); } return; }
  if(act==='mark'){ const a = findA(id); S.sent[a.key] = asOf; save(); closeSheet(); render(); toast(`${a.c.name} marked as reminded`); return; }
  if(act==='unmark'){ const a = findA(id); delete S.sent[a.key]; save(); closeSheet(); render(); toast('Reminder mark removed'); return; }
  if(act==='askSave'){
    const c = findA(id).c, n = readEdit();
    const changes = Object.keys(n).filter(k => String(c[k]??'') !== n[k] && !(k.endsWith('Raw') && parseDate(c[k],S.settings.dateOrder).iso && parseDate(c[k],S.settings.dateOrder).iso===n[k]));
    const box = $('#editConfirm');
    if(!changes.length){ box.innerHTML = `<div class="confirm">No changes to save.</div>`; return; }
    if(!n.name){ box.innerHTML = `<div class="confirm red">Customer name can't be empty.</div>`; return; }
    box.innerHTML = `<div class="confirm"><strong>Save these changes?</strong><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Field</th><th>Before</th><th>After</th></tr></thead><tbody>${changes.map(k=>`<tr><td>${LABELS[k]}</td><td>${esc(c[k]||'—')}</td><td>${esc(n[k]||'—')}</td></tr>`).join('')}</tbody></table></div><div class="row"><button class="btn primary" data-act="doSave" data-id="${id}">Yes, save</button><button class="btn" data-act="cancelConfirm">Keep editing</button></div></div>`;
    box.scrollIntoView({block:'nearest'}); return;
  }
  if(act==='cancelConfirm'){ $('#editConfirm').innerHTML=''; return; }
  if(act==='doSave'){ const c = findA(id).c; Object.assign(c, readEdit()); commitReal(); closeSheet(); render(); toast('Saved'); return; }
  if(act==='askDel'){ const c = findA(id).c; $('#editConfirm').innerHTML = `<div class="confirm red"><strong>Delete ${esc(c.name)} from the list?</strong> This removes them and their screenshot from this device. Re-import your file to bring them back.<div class="row"><button class="btn danger" data-act="doDel" data-id="${id}">Yes, delete</button><button class="btn" data-act="cancelConfirm">Keep</button></div></div>`; return; }
  if(act==='doDel'){ S.customers = S.customers.filter(c => c.id!==id); await shotDel(id); commitReal(); closeSheet(); render(); toast('Customer deleted'); return; }
  if(act==='delShot'){ await shotDel(id); openEdit(id); render(); return; }
  if(act==='doImport'){
    if(!pendingImport) return;
    // keep ids (and screenshots, reminded marks) for customers matched by policy or name+phone
    const keyOf = c => c.policy ? 'p:'+String(c.policy).trim().toLowerCase() : 'n:'+String(c.name).trim().toLowerCase()+'|'+String(c.phoneRaw).replace(/\D/g,'');
    const old = {}; if(!S.isSample) S.customers.forEach(c => { old[keyOf(c)] = c.id; });
    const used = new Set();
    pendingImport.customers.forEach(c => { const k = keyOf(c); if(old[k] && !used.has(old[k])){ c.id = old[k]; used.add(c.id); } });
    if(S.isSample){ await shotClearAll(); S.sent = {}; }
    else { for(const oid of Object.values(old)) if(!used.has(oid)) await shotDel(oid); }
    S.customers = pendingImport.customers; S.isSample = false; pendingImport = null; save(); closeSheet(); tab='due'; render(); toast(`Imported ${S.customers.length} customers`); return;
  }
  if(act==='template'){
    const csv = 'Customer Name,Company,Birthday,Phone,Email,Account Manager,Policy No,Premium Amount,Premium Due Date,Frequency\r\nExample Name,Example Sdn Bhd,15/04/1985,012-345 6789,name@example.com,Your AM,P-0000001,350.00,28/11/2026,Monthly\r\n';
    offerFile('premium-due-template.csv', new Blob(['﻿'+csv], {type:'text/csv'})); return;
  }
  if(act==='resetTpl'){ S.settings.tplEN = TPL_EN; S.settings.tplZH = TPL_ZH; save(); render(); toast('Default wording restored'); return; }
  if(act==='clear'){ openSheet(`${head('Clear all customer data?')}<div class="confirm red">This removes every customer, screenshot and "reminded" mark from this device. Your Excel file is not touched. The sample customers will show again.<div class="row"><button class="btn danger" data-act="doClear">Yes, clear everything</button><button class="btn" data-act="close">Cancel</button></div></div>`); return; }
  if(act==='doClear'){ await shotClearAll(); S.sent = {}; S.customers = makeSample(); S.isSample = true; save(); closeSheet(); render(); toast('All customer data cleared'); return; }
});
function commitReal(){ if(S.isSample){ S.isSample = false; } save(); }
document.addEventListener('change', async e => {
  const t = e.target;
  if(t.id==='asof'){ asOf = t.value || todayISO(); if(S.isSample) S.customers = makeSample(); render(); return; }
  if(t.id==='fileIn' && t.files[0]){ const box = $('#importResult'); if(box) box.innerHTML = '<div class="progress">Reading…</div>'; showImportResult(await readFile(t.files[0])); return; }
  if(t.id==='shotIn' && t.files[0]){ const f = t.files[0]; if(!f.type.startsWith('image/')){ toast('Choose an image file'); return; } await shotPut(t.dataset.id, f); openEdit(t.dataset.id); render(); toast('Screenshot attached'); return; }
  if(t.id==='ccQuick' && t.value){ S.settings.cc = t.value; save(); render(); toast(`Country code +${t.value} added to local numbers`); return; }
  const map = { sSender:'sender', sCurrency:'currency', sCC:'cc', sOrder:'dateOrder', sFreq:'blankFreq', sLang:'lang', sEN:'tplEN', sZH:'tplZH' };
  if(map[t.id]){ S.settings[map[t.id]] = t.value; if(t.id==='sLang') sendLang = null; save(); render(); toast('Setting saved'); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && sheetRoot.innerHTML) closeSheet(); });

<style>

.install-bar .share{display:inline-block;vertical-align:-3px;width:16px;height:16px}
</style>
<script>
(() => {
  // Offline support + "Install app" prompt (installable web app / PWA)
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) return;
  const KEY = 'pdr.installDismissed';
  let dismissed = false; try { dismissed = localStorage.getItem(KEY) === '1'; } catch (e) {}
  if (dismissed) return;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const SHARE = '<svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15V3m0 0-4 4m4-4 4 4M6 11H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1"/></svg>';
  function show(inner) {
    const bar = document.createElement('div'); bar.className = 'install-bar'; bar.setAttribute('role', 'region'); bar.setAttribute('aria-label', 'Install app');
    bar.innerHTML = `<div class="in"><img src="icons/icon-192.png?v=2" alt="">${inner}<button class="x" aria-label="Not now" data-x>×</button></div>`;
    bar.querySelector('[data-x]').onclick = () => { bar.remove(); try { localStorage.setItem(KEY, '1'); } catch (e) {} };
    document.body.appendChild(bar); return bar;
  }
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    const bar = show('<p><strong>Install Premium Due Reminder</strong>Open it from your home screen like any app, even offline.</p><button class="btn primary" data-install>Install</button>');
    bar.querySelector('[data-install]').onclick = async () => { deferred.prompt(); const r = await deferred.userChoice.catch(() => null); deferred = null; bar.remove(); };
  });
  window.addEventListener('appinstalled', () => { document.querySelector('.install-bar')?.remove(); });
  if (isIOS) show(`<p><strong>Install on your iPhone</strong>In Safari, tap Share ${SHARE} then <b>Add to Home Screen</b>.</p>`);
})();
</script>
